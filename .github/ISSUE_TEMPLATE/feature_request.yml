name: Feature request
description: Suggest an idea for ScreenKit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or annoyance, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
